connectors:
  JACK:
    type: XMR-05V
    pincount: 5
    
  HP_JACK_PCB:
    type: XHP-4
    pincount: 4
    pinlabels: [L, R, SENS, GND]
    notes: | 
      Jack connector is omitted, 
      safe to assume it's a Seahorse PCB
  
  AMP_OUT:
    type: XADR-08V <-> XADRP-08V
    pincount: 8

  HEADPHONE_AMP_CN4:
    type: XHP-4
    pincount: 4
    pinlabels: [L, R, SENS, GND]
  
  HEADPHONE_AMP_CN6:
    type: XHP-2
    pincount: 2
    pinlabels: [12V, GND]

  HEADPHONE_AMP_CN7:
    type: XHP-7
    pincount: 7
    pinlabels: [+12V, VOL_DATA, VOL_CLOCK, IN, JACK_DETECT, REC_DETECT, GND]
  
  HEADPHONE_AMP_INPUT:
    type: RCA
    pincount: 2
    pinlabels: [LEFT, RIGHT]

cables:
  JACK_WIRES:
    color_code: DIN
    colors: [GN, BU, VT, GY, BK]
  JACK_PCB_WIRES_P1:
   color_code: DIN
   colors: [GN, BU, VT, BK]
  JACK_PCB_WIRES_P2:
   color_code: DIN
   colors: [GN, BU, Gy, BK]
  
  GROUND:
    color_code: DIN
    colors: [BK]


connections:
  - 
    - HEADPHONE_AMP_CN7.HEADPHONE_AMP_CN7_P1: 7
    - <->
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P1: 4
  -
    - HEADPHONE_AMP_CN6.HEADPHONE_AMP_CN6_P1: 2
    - <->
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P1: 4
  - 
    - HEADPHONE_AMP_INPUT.HEADPHONE_AMP_INPUT_P1: [1,2]
    - <->
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P1: [1,2]

  - 
    - HEADPHONE_AMP_CN7.HEADPHONE_AMP_CN7_P2: 7
    - <->
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P2: 4
  -
    - HEADPHONE_AMP_CN6.HEADPHONE_AMP_CN6_P2: 2
    - <->
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P2: 4
  - 
    - HEADPHONE_AMP_INPUT.HEADPHONE_AMP_INPUT_P2: [1,2]
    - <->
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P2: [1,2]
  
  -
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P1: [1-4]
    - JACK_PCB_WIRES_P1: [1-4]
    - HP_JACK_PCB.HP_JACK_PCB_P1: [1-4]

  -
    - HEADPHONE_AMP_CN4.HEADPHONE_AMP_CN4_P2: [1-4]
    - JACK_PCB_WIRES_P2: [1-4]
    - HP_JACK_PCB.HP_JACK_PCB_P2: [1-4]

  -
    - JACK: [1,2,5]
    - JACK_WIRES: [1,2,5]
    - HEADPHONE_AMP_CN7.HEADPHONE_AMP_CN7_P1: [5-7]
  -
    - JACK: [3-5]
    - JACK_WIRES: [3-5]
    - HEADPHONE_AMP_CN7.HEADPHONE_AMP_CN7_P2: [5-7]
